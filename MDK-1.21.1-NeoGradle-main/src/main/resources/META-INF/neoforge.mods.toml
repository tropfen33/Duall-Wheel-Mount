modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://example.invalid/change-me"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Tropfen_33"
description = '''Adds a dual-wheel version of Offroad's Wheel Mount block, carrying two wheels side by side on one shared, steerable, brakeable axle.'''
# logoFile = "duall_wheel_mount.png" # add a real logo PNG here and uncomment if you want one

[[dependencies.'${mod_id}']]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "create"
    type = "required"
    versionRange = "[6.0.10,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "sable"
    type = "required"
    versionRange = "[2.0.0,3.0.0)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "simulated"
